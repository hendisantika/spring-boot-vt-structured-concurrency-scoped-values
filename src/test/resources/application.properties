spring.application.name=spring-boot-vt-structured-concurrency-scoped-values
# Tests run against an in-memory H2 database (MySQL compatibility mode)
spring.profiles.active=test
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:h2:mem:orderdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Never try to start Docker Compose services during tests
spring.docker.compose.enabled=false
